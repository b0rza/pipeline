<!DOCTYPE html><html lang="en" dir="ltr"><head></head><body><script>window.__reactRouterContext.streamController.enqueue("[{\"_1\":2,\"_36\":-5,\"_37\":-5},\"loaderData\",{\"_3\":4},\"($locale)/careers/$posting\",{\"_5\":6},\"jobPosting\",{\"_7\":8,\"_9\":10,\"_11\":12,\"_13\":14,\"_15\":16,\"_17\":18,\"_19\":20,\"_21\":22,\"_23\":24,\"_25\":26,\"_27\":28,\"_29\":30,\"_31\":32,\"_33\":34},\"id\",\"453ef67b-70fa-4029-a904-97e92df2a40a\",\"title\",\"Senior Infrastructure Engineer - Database Platform\",\"status\",\"Published\",\"descriptionHtml\",\"\u003cp>At Shopify, Infrastructure Engineers build and operate the systems that make global commerce available, scalable, performant, secure, simple, and cost-effective.\u003c/p>\u003cp>We’re hiring a Senior or Staff Infrastructure Software Engineer to join the Database Platform group within Shopify’s Infrastructure organization. This team owns the production infrastructure behind Shopify’s global database: a YugabyteDB-based, PostgreSQL-compatible, horizontally scalable data platform that is becoming a core system of truth for Shopify. You’ll help build and extend our database management control plane: the software layer that provisions databases, orchestrates safe operational workflows, encodes reliability guardrails, and lets Shopify run Yugabyte at global scale.\u003c/p>\u003cp>This role is hands-on. You’ll write code, operate production systems, debug hard distributed-systems failures, improve reliability, and build the tooling that lets Shopify run Yugabyte safely at scale. At the Staff level, we’ll expect you to lead through ambiguity, own the hardest technical problems, influence across teams, and model accountability for systems where the pager escalates to you.\u003c/p>\u003cp>Here is a sampling of some of the types of systems we are improving and automating:\u003c/p>\u003cul>\u003cli>\u003cp>Our backup systems (e.g. snapshots, backup verifications)\u003c/p>\u003c/li>\u003cli>\u003cp>Configuration management tools (we use Ansible today)\u003c/p>\u003c/li>\u003cli>\u003cp>Third-party tools such as PgBouncer\u003c/p>\u003c/li>\u003cli>\u003cp>Internal control plane for managing our fleet\u003c/p>\u003c/li>\u003cli>\u003cp>Data and schema migration systems\u003c/p>\u003c/li>\u003cli>\u003cp>Building database safety and performance guardrails that help application teams ship safely\u003c/p>\u003c/li>\u003cli>\u003cp>Managing and operating our global database built on top of YugabyteDB\u003c/p>\u003c/li>\u003c/ul>\u003ch2>\u003cstrong>Qualifications\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>Experience and skills that are important for success in this role (we don’t expect you to have done all of this):\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>The ability to write high quality code in a high level programming language (e.g. Go, Ruby)\u003c/p>\u003c/li>\u003cli>\u003cp>Experience or interest in configuration management, ease working in a Linux shell\u003c/p>\u003c/li>\u003cli>\u003cp>Experience with relational databases, PostgreSQL internals, distributed databases, or database reliability engineering\u003c/p>\u003c/li>\u003cli>\u003cp>Experience with a cloud platform (e.g. AWS, GCP, Azure)\u003c/p>\u003c/li>\u003cli>\u003cp>Experience with Site Reliability engineering/ DevOps practices or a software engineer, interested in infrastructure work\u003c/p>\u003c/li>\u003cli>\u003cp>Strong technical mentorship, dedication to psychological safety at the workplace\u003c/p>\u003c/li>\u003cli>\u003cp>Self-starter and a team player keen on mentoring others and growing your own skill set within a fast paced environment.\u003c/p>\u003c/li>\u003cli>\u003cp>Experience working on a remote or distributed engineering team.\u003c/p>\u003c/li>\u003cli>\u003cp>A commitment and drive for quality, technical excellence and results\u003c/p>\u003c/li>\u003cli>\u003cp>Participating in an on call rotation and/or site/database reliability engineering (SRE/DRE) experience\u003c/p>\u003c/li>\u003c/ul>\u003cp>While our stack currently comprises YugabyteDB, Ansible, Ubuntu, Ruby, Golang, Kubernetes, PgBouncer, Google Cloud Platform, experience with the exact components of the current stack is not always necessary. Your willingness and enthusiasm to learn is the top requirement.\u003c/p>\u003cp>\u003cem>At Shopify, we pride ourselves on moving quickly—not just in shipping, but in our hiring process as well. If you're ready to apply, please be prepared to interview with us within the week. Our goal is to complete the entire interview loop within 30 days. You will be expected to complete a live pair programming session, come prepared with your own IDE.\u003c/em>\u003c/p>\u003cp>This role \u003cem>requires\u003c/em> on-call work.\u003c/p>\u003cp>\u003cstrong>Ready to build the backbone of Shopify? Join the team that's making commerce better for everyone.\u003c/strong>\u003c/p>\",\"departmentName\",\"Shopify\",\"teamName\",\"Engineering\",\"locationName\",\"Americas\",\"workplaceType\",\"Remote\",\"publishedDate\",\"2026-10-23\",\"isRemote\",true,\"employmentType\",\"FullTime\",\"isListed\",true,\"updatedAt\",\"2026-10-23T16:25:55.946Z\",\"compensation\",{\"_35\":-5},\"compensationTierSummary\",\"actionData\",\"errors\"]");</script></body></html>
