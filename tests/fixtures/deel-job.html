<!DOCTYPE html><html lang="en" dir="ltr"><head><title>Fraud Operations Lead</title></head><body><script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Fraud Operations Lead","description":"Klarna, briefly At Klarna, we're building an everyday finance network, helping over 120 million consumers across 26 countries save time and money, and worry less about their finances. Working here means taking on problems most companies never get to solve, and being hands-on enough that the interesting part of the work lands with you, not someone else — you'll build with AI, not watch it happen. This is the stretch zone. Come find out what you're capable of. About the role As Fraud Operations Lead, you sit at the intersection of operational execution and fraud intelligence, shaping how fraud operations evolve as Klarna scales. You'll improve how teams, processes, and tools work together to deliver efficient, high-quality outcomes across consumer and partner fraud. This position combines leadership with hands-on expertise. You'll own operational quality while continuously advancing how the work is performed. What you'll do • You'll own and evolve Klarna's fraud operations framework. • You'll lead a team of specialists while staying hands-on, so you understand the processes and can keep quality high. • You'll work closely with external vendors while keeping expertise in-house, so the team can validate workflows, step in during operational peaks, and keep improving performance. • You'll identify inefficiencies and optimize processes to make operations more consistent and effective. • You'll act as the bridge between fraud operations and the wider fraud function, including prevention, detection, and investigation. That means making sure operational insights inform strategy and that changing priorities turn into scalable processes. Who you are • You've spent 5+ years working in fraud operations in fintech, payments, or a similar environment. • You've managed teams while also doing hands-on operational work yourself. • You've led process improvement work: you've spotted inefficiencies and put scalable solutions in place. • You're familiar with fraud tooling, case management systems, and both manual and automated workflows. • You make decisions based on data, and you've defined KPIs and used the results to guide your choices. • You collaborate with cross-functional stakeholders, including Product, Tech, Risk, and Compliance. • You've worked with external vendors, including monitoring their performance and managing the relationship. • You communicate clearly with stakeholders at every level, from specialists to senior leadership. Bonus points for • Certification such as Certified Fraud Examiner (CFE) or equivalent • Hands-on experience in fraud prevention, detection, or investigation functions • Experience influencing tooling or automation improvements • Experience scaling an operations team as volumes grew Things you should know before applying • This position is based in London. • Pay: the starting salary range for this position is £79,551–£126,237 per year. Where an offer sits in that range depends on the level we assess you at against our internal framework, which considers skills, relevant experience and the scope of the position. • Working together: we value co-located teams. This team currently meets in the London office two to three days per week; this varies by team and can change over time. • Non-obvious backgrounds are welcome. Diversity of skills, perspectives and backgrounds is how we create, innovate, and disrupt like no other. Please include a CV in English. Concrete beats comprehensive — what you built, what it did, what it cost. If a project matters more than a job title, lead with the project. Curious to learn more about Klarna and what it's like to work here? Explore our career site!","datePosted":"2026-10-02T12:41:35.439Z","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"Klarna","logo":"https://s3.eu-west-1.amazonaws.com/api-prod.letsdeel.com/public/ats/7e2ccf5c-ce28-451a-adf0-625015848270/light_logo/C4bjpIXSOrrm5d38Vk7fp"},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"London"}}],"identifier":{"@type":"PropertyValue","name":"Deel ATS Job Posting ID","value":"05a22eb7-b75d-4c8c-abdc-21e321fd6f92"},"directApply":true,"url":"https://jobs.deel.com/klarna/job-details/05a22eb7-b75d-4c8c-abdc-21e321fd6f92/overview"}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Klarna Careers","item":"https://jobs.deel.com/klarna"},{"@type":"ListItem","position":2,"name":"Fraud Operations Lead"}]}</script><script>self.__next_f.push([1,"{\"id\":\"05a22eb7-b75d-4c8c-abdc-21e321fd6f92\",\"jobId\":\"5f204e53-5db1-4389-877a-6f41f184d429\",\"title\":\"Fraud Operations Lead\",\"richtextDescription\":\"$26\",\"applicationFormId\":\"0877b7a6-6b23-43b8-8002-f881005d4918\",\"isCompensationVisible\":true,\"createdAt\":\"2026-05-18T20:21:57.328Z\",\"updatedAt\":\"2026-10-02T12:35:47.402Z\",\"job\":{\"id\":\"5f204e53-5db1-4389-877a-6f41f184d429\",\"workArrangementEnum\":\"ON_SITE\",\"jobEmploymentTypes\":[{\"id\":\"bacfdcf0-1a00-41a7-99af-eabac93dad4d\",\"employmentType\":{\"id\":\"62e0c8ef-78c9-4cc8-ae0a-2930c60b6271\",\"name\":\"Full-time\"}}],\"jobLocations\":[{\"id\":\"a058e01e-c374-47a9-bf8d-3e72fb750dbb\",\"location\":{\"id\":\"91b000b1-6da9-44e5-af7b-26978f343d94\",\"name\":\"London\",\"locationGroup\":null,\"country\":{\"code\":\"GB\",\"name\":\"United Kingdom\",\"geographicalRegion\":\"EMEA\"}}}],\"currentCompensation\":{\"id\":\"42c54d0d-382f-47e4-b98e-ce64076018c9\",\"currencyIsoCode\":\"GBP\",\"minAmount\":79551,\"maxAmount\":126237},\"tags\":[],\"jobTeams\":[],\"jobDepartments\":[{\"id\":\"d1893f20-e925-48f4-b9b0-6c40d6dec38c\",\"department\":{\"id\":\"4730e551-184f-4477-8bd8-a36e743e8
