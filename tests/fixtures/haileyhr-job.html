<script>self.__next_f.push([1,"### Team Tetris söker en backend-stjärna som vill jobba med C# .Net/.Net Core, SQL \u0026 API-integrationer i ett sammansvetsat team som bygger framtidens lösningar. Är det dig vi söker?\n\nTetris-teamet är en passionerad grupp som specialiserar sig på att bygga avancerade och skräddarsydda webbplatser för kunder med höga krav på kvalitet och funktionalitet. Vi arbetar med den open-source-baserade plattformen Umbraco och samarbetar med kunder från olika branscher, där vi fokuserar på smarta integrationer och unika funktioner.\n\nI vår moderna tech-stack har vi .NET/.NET Core och C# som grundpelare för backend-utvecklingen. Vårt team är inte bara dedikerat till att lösa tekniska utmaningar, utan vi värdesätter också kontinuerlig utveckling av både oss själva och våra lösningar.\n\n**Vem är du?**\n\nDu är en erfaren backend-utvecklare som brinner för att skapa effektiva och hållbara lösningar. Du trivs med att arbeta nära ditt team och att bidra till gemensamma mål genom samarbete och kunskapsutbyte. Ditt intresse för att förstå kundernas behov driver dig att utveckla lösningar som gör skillnad. Du är inte rädd för att ta dig an komplexa tekniska utmaningar och ser det som din uppgift att lösa de behov som uppstår under projektens gång.\n\n**Vi söker dig som har minst 4 års erfarenhet inom:**\n\n- C#\n\n- .NET/.NET Core\n\n- SQL\n\n- API-integrationer\n\n- Azure\n\n**Det är meriterande om du också har kunskap inom:**\n\n- Umbraco eller andra C#-baserade CMS\n\n- JavaScript och frontend-teknologier som React eller Vue.js\n\n- Tillgänglighet och UX/UI-principer\n\n- GIT och versionshantering\n\n**Vad är ett team på Toxic?**\n\nFör två år sedan valde vi på Toxic att organisera oss i dedikerade leveransteam för att skapa bättre fokus och långsiktighet i vårt arbete. Varje team har en primär plattform som sin bas och ett nära samarbete med en grupp kunder, där vi både förvaltar befintliga lösningar och driver nya, spännande projekt.\n\nVåra team består oftast av 4 till 8 personer med olika expertiser anpassade efter de unika behov och utmaningar som lösningarna kräver. Vi strävar mot att bygga en stark T-kompetens inom teamen – där varje medlem har ett specialistområde men också bredare kunskap inom andra delar av utvecklingsprocessen. Detta hjälper oss att minska personberoendet, öka tryggheten och bygga en starkare sammanhållning där vi alltid kan stötta och lära av varandra.\n\n\\*\\*Start:\\*\\* Enligt överenskommelse\n\n\\*\\*Lön:\\*\\* Individuell lönesättning\n\n\\*\\*Placering:\\*\\* Vi ser helst att du är placerad i Jönköping, men även Anderstorp, Göteborg och Borås fungerar.\n\n\\*\\*Omfattning:\\*\\* Enligt överenskommelse\n\n**Är du redo att bli en del av Team Tetris? Tveka inte att skicka in din ansökan!**"])</script>
