# Slice: desirable employers to watch for senior/lead engineering roles (employment or contract). Date: 2026-11-07.
# Not agencies: product and infrastructure companies. Not seeded into universe/companies.yaml; this is a watch list for the owner to pick from.
# Method: 54 candidates picked from own knowledge in five groups (payments-fintech, commerce-platforms, commerce-adjacent,
#   devtools-ai, remote-first-europe), then four dropped (Sofascore, Memgraph: no board and no open roles; Replit: hybrid SF only;
#   Spreedly: remote US only) to reach 50. Remote policy, careers page and news from WebSearch/WebFetch on company sites, their
#   job-board APIs and news outlets. LinkedIn, Indeed and Glassdoor were not opened, searched or cited (AGENTS.md rule 3).
# Boards: every ats slug below was fetched once through core/http.ts fetchText (1 req/s per host) with the adapter's own feedUrl
#   and parse; postings_seen is the parsed count on 2026-11-07. eng is postings whose title says engineer/developer/architect.
#   A greenhouse or ashby 404 means no board; a smartrecruiters or workable 200 with 0 postings proves nothing (unknown names also
#   return 0), so those are not recorded as boards.
# bar: reach = Stripe-level hiring bar; fit = realistic now for the profile; stretch = profile is credible but something stands in
#   the way (location rule, stack gap, hiring slowdown, office-first).
# remote.europe: yes = a page or live posting opens the role to Europe/EMEA/anywhere or a time-zone band that covers Croatia;
#   partial = remote only in named countries that leave Croatia out, or hybrid/office only; no = office-first; unclear = remote-first
#   but no region stated; unknown = nothing found.
# Not checked: whether any company has a Croatian legal entity beyond the Croatian ones (none found); whether the EOR used covers
#   Croatia; the countries GitLab exited in June 2026; interview style beyond what the company itself publishes; Saleor's Notion
#   board (JavaScript-only page, unread); Medusa and Clerk have no open engineering role, so their current remote rule is unseen.
#   Claims marked "unverified" in notes come from search snippets or aggregators only.

