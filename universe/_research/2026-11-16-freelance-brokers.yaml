    robots: "User-agent: * Disallow: (empty); only named SEO and archive bots are blocked. Same file on freelancermap.com"
    terms: "No clause on crawling or automated access. Closest: §4.1a users must not overload the network infrastructure ('nicht durch uebermaessige Inanspruchnahme ueberlastet werden'); §4.5 use the information 'nur innerhalb seines Vertrages und fuer eigene Zwecke'"
    verdict: page-ok
