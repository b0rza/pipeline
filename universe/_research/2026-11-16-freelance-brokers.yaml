# Slice: freelance brokers and assignment marketplaces that publish open contract assignments. Date: 2026-11-16.
# Question: which of them list assignments the owner could take (senior full-stack/lead, commerce, Vue/Nuxt/React/TS/Node,
#   remote from Split through his own company, B2B), and could the pipeline read those listings as one more source.
#   Additive frame (PLAN.md): a broker source sits beside the agency and employer lists and the current contract; nothing is replaced.
# Method: 23 candidates from the brief plus own knowledge (emagine, Ework/Verama, freelance.de, Proxify, Etengo's and Hays' own
#   portals). robots.txt for every host was fetched once through core/http.ts fetchText (1 req/s per host, the pipeline's own
#   User-Agent) in a scratchpad script; listing pages were fetched the same way only where robots.txt allows the path. Help pages,
#   terms and news were read with WebFetch/WebSearch. LinkedIn, Indeed and Glassdoor were not opened, searched, cited or relied on
#   (AGENTS.md rule 3); search results that pointed at them were discarded. No account was created and nothing was logged in to.
# Counts are one snapshot on 2026-11-16 and come from the site's own filter counts where it has them.
# readable.verdict: feed = RSS/API exists; page-ok = robots.txt allows the listing path and the terms read have no clause against
#   automated access; forbidden = robots.txt or the terms disallow it (clause quoted); login-only = no listing visible without an
#   account; unknown = could not be settled (reason given).
# fit: strong = stack, level, remote-from-Croatia and B2B all line up; possible = one of those is uncertain or costs something
#   (language, DACH, rate); poor = at least one is clearly against him.
# Not checked: any listing behind a login (Malt, Lemon.io, Proxify, emagine portal, Verama, Gun.io app, Braintrust app, JobServe
#   saved-search RSS); whether German- or Swedish-language assignments on freelancermap and Cinode accept an English-speaking
#   contractor; what each broker actually pays a Croatian company (no broker publishes its margin except where noted); Hays, Etengo,
#   GULP and Striive terms of use (not found or not reachable); Malt's country list (help.malt.com refused WebFetch with 403);
#   SOLCOM's portal (403 to both the pipeline's User-Agent and WebFetch). Claims marked "unverified" come from search snippets only.
# Left out on purpose: Upwork, Fiverr and Freelancer.com (general marketplaces, not brokers; Upwork's robots.txt also disallows
#   /jobs/ for every agent); general job boards; anything built on LinkedIn, Indeed or Glassdoor.

