# Slice: Shopify partner directory, service partners (shopify.com/partners/directory/locations/{country}), tiers Platinum, Premier, Plus; US, GB, IE, Nordics, Benelux, FR, ES, IT, PL, CH, CZ, rest of EU27 except DE/AT.
# Date: 2026-11-05. Harvested 854 tiered partners; filtered to 394 (all Platinum/Premier; Plus with >=10 reviews, or >=1 review and Headless/Custom apps/Systems integration on the card); 118 dropped as already under universe/, 7 giants, 4 without a website; 265 probed; 6 on an adapter vendor.
# Method: scripted harvest + home/careers probe through core/http.ts fetchText (.scratch/shopify-dir/), hits resolved with scripts/resolve.ts (no --verify); meetdomaine.com and ecommerceaccelerators.com redirect to already-listed domaineworldwide.com and zaelab.com.

