# Slice: BENELUX (NL, BE) first, then rest of eligible EU + CH (no DE/AT, UK, Nordics, US).
# Date: 2026-11-05. 81 agencies screened; 5 qualify (adapter vendor + slug), the rest are the record of what was checked.
# Method: npm run resolve on careers URLs, plus a scratch fetch of each homepage's careers links grepped for job-board hosts; WebFetch for 403/JS pages. "source not checked" = listing not confirmed.

# --- qualifying ---
- name: De Nieuwe Zaak
  domain: denieuwezaak.nl
  country: NL
  source: bigcommerce-agency-lists
  careers_url: https://www.denieuwezaak.nl/vacatures
  ats: { vendor: recruitee, slug: denieuwezaak }
  notes: "Zwolle, 80+ staff (its Intershop partner page), BigCommerce EMEA Partner of the Year 2026, also Shopify/Intershop; part of United Playgrounds. Careers page is in-house but serves offer images from recruitee-main S3; slug denieuwezaak.recruitee.com seen in a search result only, so set by hand: verify"
- name: Happy Horizon
  domain: happyhorizon.com
  country: NL
  source: shopify-agency-lists
  careers_url: https://werkenbijhappyhorizon.com/
  ats: { vendor: recruitee, slug: werkenbijhappyhorizon.com }
  notes: "Dutch agency group, 7 hubs; 250+ (own exhibitor profile) to ~360 staff (Computable), above band. Owns Experius (experius.nl redirects here; Magento/Adobe, Shopware, Shopify, BigCommerce) and Ask Phill (Shopify Platinum, in Shopify directory). Recruitee custom-domain career site, also links happyhorizonbv.recruitee.com; group board covers all hubs"
- name: Synolia
  domain: synolia.com
  country: FR
  source: clutch
  careers_url: https://careers.synolia.com/
  ats: { vendor: teamtailor, slug: careers.synolia.com }
  notes: "Lyon, 50-249 staff (Clutch), CRM (Salesforce) plus e-commerce (Magento/Adobe, Sylius, Akeneo). Teamtailor custom-domain career site linked from synolia.com"
- name: Strix
  domain: strix.net
  country: PL
  source: clutch
  careers_url: https://career.strix.net/
  ats: { vendor: recruitee, slug: strix1 }
  notes: "Krakow HQ (Clutch), offices Utrecht, 's-Hertogenbosch, Frankfurt, Bochum; Clutch says 50-249 but own site says 300+ across Strix Global (above band). Magento/Adobe, Shopware, Shopify Plus, commercetools. career.strix.net redirects to strix1.recruitee.com"
- name: Fik
  domain: fik.life
  country: ES
  source: shopify-agency-lists
  careers_url: https://fik.life/
  ats: { vendor: recruitee, slug: fik }
  notes: "Madrid, Shopify Premier partner since 2016 (Shopify directory), size unverified. Shopify Plus builds. fik.recruitee.com linked from homepage"

